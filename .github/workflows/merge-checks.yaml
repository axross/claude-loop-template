name: Merge Checks

# INIT.md keeps project commands dormant until the template is adapted.

on:
  pull_request:
  push:
    branches: [main] # ← the project's default branch

# Cancel superseded runs on PR refs only: on the default branch every push is a
# distinct merged commit whose checks must run to completion, or back-to-back
# merges leave earlier commits with cancelled (never-completed) verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    name: Documentation and Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash .github/scripts/check-documentation.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Template Adaptation
        id: adapted
        run: |
          if [ -f INIT.md ]; then
            echo "::notice::Template not yet adapted (INIT.md present) — skipping lint."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node # ← replace with the project's toolchain setup
        if: steps.adapted.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dependency Installation
        if: steps.adapted.outputs.run == 'true'
        run: |
          {{INSTALL_CMD}}
      - name: Lint
        if: steps.adapted.outputs.run == 'true'
        run: |
          {{LINT_CMD}}

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Template Adaptation
        id: adapted
        run: |
          if [ -f INIT.md ]; then
            echo "::notice::Template not yet adapted (INIT.md present) — skipping unit tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node # ← replace with the project's toolchain setup
        if: steps.adapted.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dependency Installation
        if: steps.adapted.outputs.run == 'true'
        run: |
          {{INSTALL_CMD}}
      - name: Unit Test Run
        if: steps.adapted.outputs.run == 'true'
        run: |
          {{UNIT_TEST_CMD}}
