name: Template Checks

# GitHub Actions runs these checks for the template repository.
# INIT.md removes this workflow in step 7, but the installed skills keep the
# checkers. CI in an adopted project can reuse each job together with its
# setup steps.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  links:
    name: Relative Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Relative Links
        run: node .claude/skills/agent-skill-authoring/scripts/check-links.mjs

  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare documentation validators
        run: |
          npm ci --ignore-scripts --prefix .claude/skills/living-project-documentation/scripts
          python3 -m pip install PyYAML==6.0.3
          curl -fsSL https://raw.githubusercontent.com/open-knowledge-format/open-knowledge-format/527e81aff55992be21507e97004286789126f88c/skills/okf-generate/scripts/validate.py -o "$RUNNER_TEMP/validate-okf.py"
      - name: Check docs/
        run: |
          node .claude/skills/living-project-documentation/scripts/check-docs.mjs \
            --validator "$RUNNER_TEMP/validate-okf.py" --source-root . docs
